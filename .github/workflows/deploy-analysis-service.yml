name: Deploy analysis-service

on:
  push:
    branches: [main]
    paths:
      - 'analysis-service/**'
      - '.github/workflows/deploy-analysis-service.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pitch-coach/analysis-service
  DEPLOY_PATH: /opt/pitch-coach/analysis-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            ./analysis-service
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "analysis-service/compose.prod.yaml"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            docker network create pitchcoach-net 2>/dev/null || true
            cd ${{ env.DEPLOY_PATH }}

            docker compose -f compose.prod.yaml pull
            IMAGE_REF=$(docker compose -f compose.prod.yaml config --images | head -1)
            PULLED_DIGEST=$(docker inspect --format='{{.Id}}' "$IMAGE_REF")
            echo "pulled image digest: $PULLED_DIGEST"

            docker compose -f compose.prod.yaml up -d --force-recreate

            sleep 5
            for SERVICE in analysis-api analysis-worker; do
              CONTAINER_ID=$(docker compose -f compose.prod.yaml ps -q "$SERVICE")
              RUNNING_DIGEST=$(docker inspect --format='{{.Image}}' "$CONTAINER_ID")
              IS_RUNNING=$(docker inspect --format='{{.State.Running}}' "$CONTAINER_ID")
              echo "$SERVICE running image digest: $RUNNING_DIGEST (running=$IS_RUNNING)"

              if [ "$PULLED_DIGEST" != "$RUNNING_DIGEST" ]; then
                echo "::error::배포 검증 실패 - $SERVICE 컨테이너 이미지가 방금 pull한 이미지와 다릅니다 (pulled=$PULLED_DIGEST, running=$RUNNING_DIGEST)"
                exit 1
              fi
              if [ "$IS_RUNNING" != "true" ]; then
                echo "::error::배포 검증 실패 - $SERVICE 컨테이너가 실행 중이 아닙니다"
                exit 1
              fi
            done

            HEALTH_OK=false
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                HEALTH_OK=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "::error::배포 검증 실패 - analysis-api 헬스체크(/health)가 응답하지 않습니다"
              exit 1
            fi

            echo "배포 검증 성공"
            docker image prune -f
