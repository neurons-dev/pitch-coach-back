name: Deploy core-service

on:
  push:
    branches: [main]
    paths:
      - "core-service/**"
      - ".github/workflows/deploy-core-service.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pitch-coach/core-service
  DEPLOY_PATH: /opt/pitch-coach/core-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            ./core-service
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "core-service/docker-compose.prod.yml"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            docker network create pitchcoach-net 2>/dev/null || true
            cd ${{ env.DEPLOY_PATH }}

            docker compose -f docker-compose.prod.yml pull
            IMAGE_REF=$(docker compose -f docker-compose.prod.yml config --images)
            PULLED_DIGEST=$(docker inspect --format='{{.Id}}' "$IMAGE_REF")
            echo "pulled image digest: $PULLED_DIGEST"

            docker compose -f docker-compose.prod.yml up -d --force-recreate

            sleep 5
            RUNNING_CONTAINER_ID=$(docker compose -f docker-compose.prod.yml ps -q core-service)
            RUNNING_DIGEST=$(docker inspect --format='{{.Image}}' "$RUNNING_CONTAINER_ID")
            echo "running image digest: $RUNNING_DIGEST"

            if [ "$PULLED_DIGEST" != "$RUNNING_DIGEST" ]; then
              echo "::error::배포 검증 실패 - 실행 중인 컨테이너 이미지가 방금 pull한 이미지와 다릅니다 (pulled=$PULLED_DIGEST, running=$RUNNING_DIGEST)"
              exit 1
            fi

            HEALTH_OK=false
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8080/actuator/health >/dev/null; then
                HEALTH_OK=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "::error::배포 검증 실패 - 헬스체크(actuator/health)가 응답하지 않습니다"
              exit 1
            fi

            echo "배포 검증 성공"
            docker image prune -f
