services:
  analysis-api:
    image: ${ECR_REGISTRY}/pitch-coach/analysis-service:latest
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
    restart: unless-stopped
    networks:
      - pitchcoach-net

  analysis-worker:
    image: ${ECR_REGISTRY}/pitch-coach/analysis-service:latest
    command: ["python", "-m", "app.worker_main"]
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
      HF_HOME: /models
    # 볼륨이 없으면 컨테이너를 새로 만들 때마다 whisper 모델을 다시 내려받는다.
    volumes:
      - whisper-cache:/models
    restart: unless-stopped
    networks:
      - pitchcoach-net

volumes:
  whisper-cache:

networks:
  pitchcoach-net:
    external: true
