services:
  postgres:
    image: postgres:16
    profiles: ["local-db"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  analysis-api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  analysis-worker:
    build: .
    command: ["python", "-m", "app.worker_main"]
    env_file:
      - .env
    environment:
      HF_HOME: /models
    volumes:
      - whisper-cache:/models
    restart: unless-stopped

volumes:
  pgdata:
  whisper-cache:
