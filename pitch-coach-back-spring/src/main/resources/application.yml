spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://neurons.cvm4uk8i2nol.ap-northeast-2.rds.amazonaws.com:5432/pitchcoach_core
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info